<svg viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="greenBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#b6ffb0"/>
      <stop offset="45%" stop-color="#4ade4a"/>
      <stop offset="100%" stop-color="#128012"/>
    </radialGradient>
    <linearGradient id="greenShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Soft glow behind balloon -->
  <ellipse cx="200" cy="220" rx="150" ry="180" fill="#7dffb0" opacity="0.35" filter="url(#greenGlow)"/>

  <!-- String -->
  <path d="M200 400 Q190 430 205 455 Q220 480 200 500" stroke="#8a5a2b" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Knot -->
  <path d="M188 385 L200 405 L212 385 Z" fill="#128012"/>

  <!-- Balloon body -->
  <ellipse cx="200" cy="220" rx="140" ry="170" fill="url(#greenBody)" stroke="#0a5c0a" stroke-width="4"/>

  <!-- Glossy highlight -->
  <ellipse cx="150" cy="150" rx="55" ry="75" fill="url(#greenShine)"/>

  <!-- +2 badge -->
  <circle cx="200" cy="220" r="34" fill="#ffffff" opacity="0.85"/>
  <text x="200" y="232" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#128012" text-anchor="middle">+2</text>
</svg>
