<svg viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bombBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#6a6a6a"/>
      <stop offset="45%" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="bombShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fuseSpark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59a"/>
      <stop offset="50%" stop-color="#ff9d2e"/>
      <stop offset="100%" stop-color="#ff4d00"/>
    </radialGradient>
  </defs>

  <!-- Fuse -->
  <path d="M200 50 Q210 30 195 15 Q182 3 195 -10" stroke="#8a5a2b" stroke-width="6" fill="none" stroke-linecap="round" transform="translate(0,20)"/>
  <circle cx="200" cy="35" r="12" fill="url(#fuseSpark)"/>

  <!-- Knot -->
  <path d="M188 385 L200 405 L212 385 Z" fill="#000000"/>

  <!-- String -->
  <path d="M200 400 Q190 430 205 455 Q220 480 200 500" stroke="#8a5a2b" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Balloon body -->
  <ellipse cx="200" cy="220" rx="140" ry="170" fill="url(#bombBody)" stroke="#000000" stroke-width="4"/>

  <!-- Glossy highlight -->
  <ellipse cx="150" cy="150" rx="50" ry="65" fill="url(#bombShine)"/>

  <!-- Angry eyes -->
  <path d="M150 205 L180 220" stroke="#ff2b2b" stroke-width="7" stroke-linecap="round"/>
  <path d="M250 205 L220 220" stroke="#ff2b2b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="170" cy="235" r="10" fill="#ff2b2b"/>
  <circle cx="230" cy="235" r="10" fill="#ff2b2b"/>

  <!-- Angry mouth -->
  <path d="M170 275 Q200 260 230 275" stroke="#ff2b2b" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Warning label -->
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ff2b2b" text-anchor="middle">-3</text>
</svg>
