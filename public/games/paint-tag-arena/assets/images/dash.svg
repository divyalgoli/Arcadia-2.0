<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#123449"/>
      <stop offset="100%" stop-color="#0a1c2b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="56" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#2fe4ff" stroke-width="2.5" opacity="0.8" filter="url(#glow)"/>

  <!-- single bold forward chevron with trailing speed lines -->
  <polygon points="46,32 82,64 46,96 58,96 94,64 58,32" fill="#eafcff" stroke="#2fe4ff" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="20" y1="50" x2="34" y2="50" stroke="#7ef4ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="16" y1="64" x2="34" y2="64" stroke="#7ef4ff" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <line x1="20" y1="78" x2="34" y2="78" stroke="#7ef4ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
