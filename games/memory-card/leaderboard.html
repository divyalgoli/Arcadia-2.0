<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Leaderboard - Memory Card Game</title>
    <link rel="stylesheet" href="css/leaderboard.css">
</head>
<body>
    <div class="leaderboard-container">
        <header class="leaderboard-header">
            <h1>🏆 Leaderboard</h1>
            <p class="subtitle">Top Players Ranked by Score</p>
        </header>

        <div class="leaderboard-controls">
            <button id="clearLeaderboardBtn" class="btn btn-danger">Clear All Records</button>
            <button id="backBtn" class="btn btn-primary">Back to Game</button>
        </div>

        <div class="leaderboard-wrapper">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th class="rank-col">Rank</th>
                        <th class="name-col">Player Name</th>
                        <th class="score-col">Best Score</th>
                        <th class="time-col">Best Time</th>
                        <th class="moves-col">Least Moves</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <tr class="empty-state">
                        <td colspan="5">No records yet. Start playing to appear on the leaderboard!</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="leaderboard-stats">
            <div class="stat-card">
                <span class="stat-label">Total Players</span>
                <span class="stat-value" id="totalPlayers">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Games Played</span>
                <span class="stat-value" id="totalGames">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Avg Best Score</span>
                <span class="stat-value" id="avgScore">0</span>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/leaderboard.js"></script>
</body>
</html>
