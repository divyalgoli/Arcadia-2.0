<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Play - Memory Card Game</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body class="light-theme">

    <div class="game-wrapper">
        <div class="game-header">
            <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <div>
                    <h1>🧠 Memory Match Challenge</h1>
                    <p>Find all the matching pairs as fast as you can!</p>
                </div>
                <div id="friendsModeBadge" style="display: none; background: #FF6B6B; color: white; padding: 8px 16px; border-radius: 20px; font-weight: bold; white-space: nowrap;">
                    👥 Friends Mode
                </div>
            </div>
        </div>

        <div class="stats-container">
            <div>⏱️ Time: <span id="time-display">0</span>s</div>
            <div>👣 Moves: <span id="moves">0</span></div>
            <div>⭐ Score: <span id="score">0</span></div>
        </div>

        <div class="game-controls">
            <button class="btn btn-primary" id="newGameBtn">🔄 New Game</button>
            <button class="btn btn-secondary" id="viewLeaderboardBtn">🏆 Leaderboard</button>
            <a href="index.html" class="btn btn-secondary">🏠 Home</a>
            <button class="btn btn-secondary" id="backToNormalModeBtn" style="display: none; background: #FF6B6B;">↩️ Back to Normal Mode</button>
        </div>

        <!-- Cards are generated here by game.js -->
        <div class="game-board-container" id="board"></div>
    </div>

    <div class="modal-overlay" id="gameModalOverlay"></div>

    <!-- Player Name Entry -->
    <div class="modal" id="nameModal">
        <div class="modal-content name-entry-content">
            <h2>Welcome!</h2>
            <p>Enter your name to track your scores on the leaderboard.</p>
            <input type="text" id="playerNameInput" placeholder="Your name" maxlength="20">
            <button class="btn btn-primary" id="startPlayingBtn" style="width:100%">Start Playing</button>
        </div>
    </div>

    <!-- Win / Result Modal -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>🏆 You Won!</h2>
            <div class="result-stats">
                <div>Time<span id="resultTime">0s</span></div>
                <div>Moves<span id="resultMoves">0</span></div>
                <div>Score<span id="resultScore">0</span></div>
            </div>
            <div class="result-buttons">
                <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
                <button class="btn btn-secondary" id="goToLeaderboardBtn">View Leaderboard</button>
            </div>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- 🧩 SCRIPTS LINKING ZONE                                  -->
    <!-- These must stay in this exact sequence to wire the logs -->
    <!-- ======================================================= -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../../js/firebase-config.js"></script>
        <script src="../../js/arcadia-cloud.js"></script>
        <script src="../../js/arcadia-shell.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/friendsMode.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/score.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
