<svg viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="mysteryBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e3c8ff"/>
      <stop offset="45%" stop-color="#9b4dff"/>
      <stop offset="100%" stop-color="#4b0082"/>
    </radialGradient>
    <linearGradient id="mysteryShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="magicGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Magical particles -->
  <g fill="#e3c8ff" filter="url(#magicGlow)">
    <circle cx="70" cy="140" r="5"/>
    <circle cx="330" cy="180" r="4"/>
    <circle cx="90" cy="320" r="4"/>
    <circle cx="320" cy="300" r="6"/>
    <circle cx="200" cy="60" r="4"/>
  </g>

  <!-- String -->
  <path d="M200 400 Q190 430 205 455 Q220 480 200 500" stroke="#8a5a2b" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Knot -->
  <path d="M188 385 L200 405 L212 385 Z" fill="#4b0082"/>

  <!-- Balloon body -->
  <ellipse cx="200" cy="220" rx="140" ry="170" fill="url(#mysteryBody)" stroke="#33005c" stroke-width="4"/>

  <!-- Glossy highlight -->
  <ellipse cx="150" cy="150" rx="55" ry="75" fill="url(#mysteryShine)"/>

  <!-- Question mark -->
  <text x="200" y="255" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#ffffff" text-anchor="middle" stroke="#4b0082" stroke-width="2">?</text>
</svg>
