<svg viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="30%" stop-color="#ffd23f"/>
      <stop offset="65%" stop-color="#f4a300"/>
      <stop offset="100%" stop-color="#a86b00"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- String -->
  <path d="M200 400 Q190 430 205 455 Q220 480 200 500" stroke="#8a5a2b" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Knot -->
  <path d="M188 385 L200 405 L212 385 Z" fill="#a86b00"/>

  <!-- Balloon body -->
  <ellipse cx="200" cy="220" rx="140" ry="170" fill="url(#goldBody)" stroke="#8a5a00" stroke-width="4"/>

  <!-- Metallic diagonal shine bands -->
  <path d="M110 120 Q160 90 220 110 L200 150 Q150 140 120 165 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Glossy highlight -->
