  <!-- Sparkles -->
  <g fill="#fff6c8" stroke="#f4a300" stroke-width="1">
    <path d="M90 90 L98 108 L116 116 L98 124 L90 142 L82 124 L64 116 L82 108 Z"/>
    <path d="M300 260 L305 272 L317 277 L305 282 L300 294 L295 282 L283 277 L295 272 Z"/>
    <path d="M280 130 L284 140 L294 144 L284 148 L280 158 L276 148 L266 144 L276 140 Z"/>
  </g>

  <!-- +5 badge -->
  <circle cx="200" cy="220" r="34" fill="#ffffff" opacity="0.9"/>
  <text x="200" y="232" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#a86b00" text-anchor="middle">+5</text>
</svg>
