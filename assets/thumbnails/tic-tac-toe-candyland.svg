<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tic Tac Toe Candyland thumbnail">
  <defs>
    <linearGradient id="tt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#220f3a"/>
      <stop offset="55%" stop-color="#3a1050"/>
      <stop offset="100%" stop-color="#4a0f3d"/>
    </linearGradient>
    <filter id="tt-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#tt-bg)"/>
  <circle cx="50" cy="240" r="110" fill="#ff3d9a" opacity="0.12"/>
  <circle cx="360" cy="50" r="100" fill="#3ee8ff" opacity="0.10"/>
  <g stroke="#ffd6f2" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="155" y1="75" x2="155" y2="225"/>
    <line x1="245" y1="75" x2="245" y2="225"/>
    <line x1="105" y1="125" x2="295" y2="125"/>
    <line x1="105" y1="175" x2="295" y2="175"/>
  </g>
  <g filter="url(#tt-glow)" stroke="#3ee8ff" stroke-width="9" stroke-linecap="round">
    <line x1="120" y1="95" x2="145" y2="118"/>
    <line x1="145" y1="95" x2="120" y2="118"/>
  </g>
  <g filter="url(#tt-glow)">
    <circle cx="270" cy="150" r="15" fill="none" stroke="#ffd23e" stroke-width="8"/>
  </g>
  <g filter="url(#tt-glow)" stroke="#3ee8ff" stroke-width="9" stroke-linecap="round">
    <line x1="185" y1="185" x2="210" y2="208"/>
    <line x1="210" y1="185" x2="185" y2="208"/>
  </g>
  <text x="24" y="272" font-family="Outfit, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" opacity="0.9" letter-spacing="1">CANDYLAND TIC-TAC-TOE</text>
</svg>
